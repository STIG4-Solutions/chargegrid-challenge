# Sem esta secao, o setuptools tenta adivinhar o que empacotar e desiste: o
# diretorio tem `app`, `tests`, `alembic` e `scripts` no topo, e a deteccao
# automatica recusa mais de um. O sintoma era `pip install .` falhando com
# "Multiple top-level packages discovered in a flat-layout" - o que empurrava
# quem precisasse das dependencias (o CI, por exemplo) a redigitar a lista
# inteira num script, onde ela envelheceria em silencio.
#
# `app*` e' o que se instala; o resto do repositorio nao e' biblioteca. No
# Dockerfile isto tambem funciona: la' o `pip install .` roda com SO' o
# pyproject.toml presente, nao encontra `app/`, e instala apenas as
# dependencias - que e' exatamente o que aquela camada quer.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "chargegrid-api"
version = "0.1.0"
description = "ChargeGrid Intelligence — backend de orquestração de recarga EV para o setor comercial (FIAP × GoodWe)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    # O extra [email] traz o email-validator, que o EmailStr dos schemas exige.
    # Sem ele a aplicacao importa e quebra na montagem do schema - so' que a
    # maquina de desenvolvimento costuma te-lo por tabela, entao a falha so
    # aparece na imagem, que instala estrito deste arquivo.
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.2",
    "pyjwt>=2.9.0",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "pymodbus>=3.6.9",
    "httpx>=0.27.2",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.8",
    "aiosqlite>=0.20.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# DDL de migration e gerado pelo autogenerate do Alembic: reformatar a mao so
# cria ruido de diff e diverge do que a proxima geracao produz.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Um laco de eventos para a sessao inteira. Sem isto o pytest-asyncio abre um
# laco novo por teste, e o engine de escopo de sessao - criado no primeiro -
# quebra em todos os seguintes, porque a conexao do asyncpg fica presa ao laco
# em que nasceu.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
