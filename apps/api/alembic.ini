[alembic]
script_location = alembic
prepend_sys_path = .
# Separador dos caminhos: sem ele o alembic avisa a cada execucao que vai
# adivinhar entre espacos, virgulas e dois-pontos.
path_separator = os
version_path_separator = os
# A URL real vem de app.core.config (variaveis de ambiente); esta linha fica vazia
# de proposito para nao versionar credenciais.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
