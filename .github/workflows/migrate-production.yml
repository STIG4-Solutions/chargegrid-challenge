name: Migrate production database

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/migrate-production.yml"
  workflow_dispatch:
    inputs:
      # Gerar historico exige a string de conexao, que e' secret - ninguem o roda da
      # propria maquina. Espelha o que `migrate-staging.yml` ja' tem, e existe por uma
      # razao concreta: `treinar.py` recusa quando nenhuma praca alcanca o minimo de
      # dias, e sem isto o job de previsao de PRODUCAO nao tem como sair do vermelho.
      #
      # Em branco, o workflow so' migra. E' o caminho do push, e ele nao deve gerar
      # dado nenhum sem alguem pedir.
      #
      # NAO E' DESTRUTIVO, e `app.historico` recusa sozinho em tres casos, dizendo a
      # razao: praca sem ponto de recarga, praca sem tarifa, e praca que JA' tem
      # operacao (`--forcar` atravessa, de proposito). Nao toca identidade de praca,
      # tarifa, conta, ponto nem sessao existente.
      historico_praca:
        description: "Slug da praca que recebe historico (vazio = so' migrar)"
        required: false
        default: ""
        type: string
      historico_carater:
        description: "Carater do dado gerado"
        required: false
        default: shopping
        type: choice
        options: [rodovia, shopping, corporativo, condominio]
      historico_dias:
        description: "Dias de historico"
        required: false
        default: "1460"
        type: string
      historico_forcar:
        description: "Gerar mesmo que a praca ja' tenha operacao"
        required: false
        default: false
        type: boolean
      seed_demo:
        description: "Popular produção com os dados de demonstração"
        required: true
        default: false
        type: boolean

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Migrate production database
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: apps/api

    env:
      # A aplicacao exige estas configuracoes ao importar o ambiente do Alembic.
      # Somente DATABASE_URL_OVERRIDE e usada para conectar durante a migracao.
      ENV: test
      DEBUG: "false"
      DATABASE_URL_OVERRIDE: ${{ secrets.PRODUCTION_DATABASE_URL }}
      PGSSLROOTCERT: /etc/ssl/certs/ca-certificates.crt
      POSTGRES_PASSWORD: unused-during-migrations
      SECRET_KEY: unused-during-migrations
      PAYMENT_WEBHOOK_SECRET: unused-during-migrations

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install API dependencies
        run: >-
          python -m pip install
          "alembic>=1.13.2"
          "sqlalchemy[asyncio]>=2.0.35"
          "asyncpg>=0.29.0"
          "pydantic[email]>=2.9.0"
          "pydantic-settings>=2.5.0"

      - name: Apply database migrations
        run: |
          alembic upgrade head
          alembic current

      # DEPOIS da migracao, e so' por dispatch com a praca preenchida. O job precisa do
      # pacote inteiro (`app.seed` e os modelos), e nao das poucas dependencias que a
      # migracao usa - por isso o install proprio.
      - name: Install the whole package
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.historico_praca != '' }}
        run: python -m pip install .

      # Recusa sozinho quando falta ponto, falta tarifa, ou quando a praca ja' tem
      # operacao - e diz a razao.
      - name: Generate history for one site
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.historico_praca != '' }}
        env:
          DATABASE_URL_OVERRIDE: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: >-
          python -m app.historico
          --praca "${{ inputs.historico_praca }}"
          --carater "${{ inputs.historico_carater }}"
          --dias "${{ inputs.historico_dias }}"
          ${{ inputs.historico_forcar && '--forcar' || '' }}

      - name: Validate demo seed secrets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_demo }}
        env:
          SEED_ADMIN_PASSWORD: ${{ secrets.PRODUCTION_SEED_ADMIN_PASSWORD }}
          SEED_OPERATOR_PASSWORD: ${{ secrets.PRODUCTION_SEED_OPERATOR_PASSWORD }}
          SEED_DRIVER_PASSWORD: ${{ secrets.PRODUCTION_SEED_DRIVER_PASSWORD }}
        run: |
          for variable in SEED_ADMIN_PASSWORD SEED_OPERATOR_PASSWORD SEED_DRIVER_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::O secret $variable de produção não foi configurado."
              exit 1
            fi
          done

      - name: Install seed dependencies
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_demo }}
        run: python -m pip install .

      - name: Seed production demo data
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_demo }}
        env:
          SEED_ADMIN_PASSWORD: ${{ secrets.PRODUCTION_SEED_ADMIN_PASSWORD }}
          SEED_OPERATOR_PASSWORD: ${{ secrets.PRODUCTION_SEED_OPERATOR_PASSWORD }}
          SEED_DRIVER_PASSWORD: ${{ secrets.PRODUCTION_SEED_DRIVER_PASSWORD }}
        run: python -m app.seed

      - name: Synchronize production demo passwords
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_demo }}
        env:
          SEED_ADMIN_PASSWORD: ${{ secrets.PRODUCTION_SEED_ADMIN_PASSWORD }}
          SEED_OPERATOR_PASSWORD: ${{ secrets.PRODUCTION_SEED_OPERATOR_PASSWORD }}
          SEED_DRIVER_PASSWORD: ${{ secrets.PRODUCTION_SEED_DRIVER_PASSWORD }}
        run: python -m app.seed_passwords
