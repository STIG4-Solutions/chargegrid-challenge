# Ambiente local: docker compose --env-file apps/api/.env up --build
# Mantem o nome de projeto anterior. O PostgreSQL 18 usa um volume versionado
# proprio, deixando intacto um eventual backend_chargegrid_pgdata do PostgreSQL 16.
# Instalacoes que usavam -p ou COMPOSE_PROJECT_NAME devem manter esse valor.
name: backend

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    ports:
      - "5432:5432"
    volumes:
      # Desde o PostgreSQL 18, a imagem oficial persiste neste diretorio.
      - chargegrid_pgdata_v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
    depends_on:
      db:
        condition: service_healthy
    env_file: ./apps/api/.env
    environment:
      POSTGRES_HOST: db
      # Aspas obrigatorias: o ':' dentro da mensagem faz o YAML ler a linha
      # como um mapa aninhado, e o arquivo inteiro deixa de parsear - o
      # `docker compose up` do README falhava antes de subir qualquer coisa.
      SECRET_KEY: '${SECRET_KEY:?gere uma com: openssl rand -hex 32}'
      CHARGER_DRIVER: ${CHARGER_DRIVER:-simulator}
      ENABLE_WORKERS: "true"
      # Sobreponivel pelo .env ou pelo shell, como o CHARGER_DRIVER acima.
      # Fixo aqui, `environment:` vencia o `env_file:` e a guarda de producao
      # ficava insoluvel: o operador editava o .env e nada mudava.
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:5173"]}'
    ports:
      - "8000:8000"
    # Migra, popula e sobe - um comando para a stack inteira ficar utilizavel.
    # O seed imprime as senhas sorteadas se SEED_*_PASSWORD nao estiver definido.
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # Job de previsao. `profiles` o mantem FORA do `up`: ele nao fica de pe' -
  # roda sob demanda, doze vezes por ano. Existe aqui, e nao so' como linha de
  # `docker run` no README, porque o que se erra ao copiar aquela linha e'
  # sempre a mesma coisa: o nome da rede, o caminho do volume, ou o
  # POSTGRES_HOST que aponta para `localhost` de dentro do container.
  forecast:
    profiles: ["forecast"]
    build:
      context: ./apps/forecast
    depends_on:
      db:
        condition: service_healthy
    env_file: ./apps/api/.env
    environment:
      POSTGRES_HOST: db
    volumes:
      # So' os modelos, e por isso o `.dockerignore`: o codigo vem da imagem,
      # o artefato treinado fica no host. Sem o volume, treinar num container
      # que se apaga em seguida jogaria fora o que acabou de ser treinado.
      - ./apps/forecast/modelos:/forecast/modelos

volumes:
  chargegrid_pgdata_v18:
