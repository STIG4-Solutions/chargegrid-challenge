# Nenhum segredo em literal aqui: tudo vem do .env ao lado deste arquivo.
# `cp .env.example .env` e edite antes de subir. A sintaxe ${VAR:?mensagem}
# faz o compose recusar a subida com uma mensagem clara se a variavel faltar,
# em vez de subir com um valor silencioso.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    ports:
      - "5432:5432"
    volumes:
      - chargegrid_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: db
      SECRET_KEY: ${SECRET_KEY:?gere uma com: openssl rand -hex 32}
      CHARGER_DRIVER: ${CHARGER_DRIVER:-simulator}
      ENABLE_WORKERS: "true"
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8000:8000"
    # Migra, popula e sobe - um comando para a stack inteira ficar utilizavel.
    # O seed imprime as senhas sorteadas se SEED_*_PASSWORD nao estiver definido.
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  chargegrid_pgdata:
